[package]
name = "chatty-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chatty-metal-protocol = { path = "../chatty-metal-protocol" }
fancy-regex = "0.16"
rayon = "1"
rustix = { version = "1", features = ["fs", "mm", "mount", "process", "system", "thread"] }
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"

[features]
# Token-protected remote debugging for test images. Never enable for production.
# The token comes from CHATTY_METAL_DEBUG_TOKEN when the image is built.
debug-agent = []
