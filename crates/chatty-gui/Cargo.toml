[package]
name = "chatty-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chatty-protocol = { path = "../chatty-protocol" }
iced.workspace = true
iced_dialog = "0.14.0"
image.workspace = true
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
# Kokoro speech uses KittenTTS's espeak phonemizer and the same ONNX Runtime.
kittentts = { version = "0.3.0", features = ["espeak"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std"] }
rfd.workspace = true
rodio = { version = "0.21", default-features = false, features = ["playback"] }
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
serde.workspace = true
