id: io.github.pheonixfirewingz.Chatty
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: chatty-gui
finish-args:
  - --share=network
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
modules:
  - name: chatty-gui
    buildsystem: simple
    build-commands:
      - |
        export PATH=/usr/lib/sdk/rust-stable/bin:$PATH
        export CARGO_HOME=$PWD/cargo-home
        export CARGO_TARGET_DIR=$PWD/target
        export ORT_LIB_LOCATION=$PWD/onnxruntime/lib
        export ORT_PREFER_DYNAMIC_LINK=1
        cargo build --release --locked --offline -p chatty-gui
      - install -Dm755 target/release/chatty-gui /app/bin/chatty-gui
      - mkdir -p /app/lib
      - cp -a onnxruntime/lib/libonnxruntime.so* /app/lib/
      - install -Dm644 packaging/flatpak/io.github.pheonixfirewingz.Chatty.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.pheonixfirewingz.Chatty.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/flatpak/io.github.pheonixfirewingz.Chatty.svg /app/share/icons/hicolor/scalable/apps/io.github.pheonixfirewingz.Chatty.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.pheonixfirewingz.Chatty/LICENSE
    sources:
      - type: git
        url: https://github.com/pheonixfirewingz/Chatty.git
        tag: v0.1.0
        x-checker-data:
          type: anitya
          project-id: todo
          tag-template: v$version
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz
        sha256: 1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b
        only-arches:
          - x86_64
        dest: onnxruntime
        strip-components: 1
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-aarch64-1.23.2.tgz
        sha256: 7c63c73560ed76b1fac6cff8204ffe34fe180e70d6582b5332ec094810241e5c
        only-arches:
          - aarch64
        dest: onnxruntime
        strip-components: 1
      # Generate before building with:
      #   python3 flatpak-cargo-generator.py Cargo.lock -o chatty-cargo-sources.json
      # (script from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)
      - chatty-cargo-sources.json
